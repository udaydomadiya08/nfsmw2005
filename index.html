<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFS Most Wanted | Rebirth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');
        
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Outfit', sans-serif; color: white; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* HUD Layout */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .bottom-row { display: flex; justify-content: space-between; align-items: flex-end; }

        /* Heat UI */
        #heat-container {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-left: 5px solid #ff3e3e;
            border-radius: 4px;
        }
        #heat-level { font-size: 32px; font-weight: 900; color: #ff3e3e; margin-right: 10px; }
        #heat-label { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #aaa; }
        #heat-progress-bg { width: 150px; height: 4px; background: #222; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        #heat-bar { width: 0%; height: 100%; background: #ff3e3e; transition: width 0.3s; }

        /* Speedo */
        .speedo { text-align: right; }
        #speed { font-size: 84px; font-weight: 900; line-height: 0.8; }
        .unit { font-size: 24px; color: #ff3e3e; font-weight: 400; }

        /* Nitro */
        #nitro-container { width: 300px; text-align: left; }
        #nitro-label { font-size: 12px; font-weight: 900; letter-spacing: 3px; margin-bottom: 8px; color: #00f2ff; }
        #nitro-bg { width: 100%; height: 12px; background: rgba(0,242,255,0.1); border: 1px solid rgba(0,242,255,0.3); border-radius: 2px; overflow: hidden; }
        #nitro-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #00f2ff, #0072ff); box-shadow: 0 0 15px #00f2ff; }

        /* Score & Wins */
        #stats { text-align: left; background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 8px; }
        #score { font-size: 24px; font-weight: 900; color: #fff; }
        #wins { font-size: 14px; color: #00ff00; text-transform: uppercase; }

        /* Start Button */
        #start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 60px;
            background: #ff3e3e;
            color: white;
            font-weight: 900;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(255,62,62,0.4);
            transition: all 0.3s;
        }
        #start-btn:hover { background: #ff1a1a; transform: translate(-50%, -52%); }
        #start-btn.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="hud">
        <div class="top-row">
            <div id="heat-container">
                <span id="heat-level">X1</span>
                <span id="heat-label">Wanted Level</span>
                <div id="heat-progress-bg"><div id="heat-bar"></div></div>
            </div>
            <div id="stats">
                <div id="score">Score: 0</div>
                <div id="wins">Wins: 0</div>
            </div>
        </div>

        <div class="bottom-row">
            <div id="nitro-container">
                <div id="nitro-label">NOS SYSTEM</div>
                <div id="nitro-bg"><div id="nitro-bar"></div></div>
            </div>
            <div class="speedo">
                <div id="speed">0</div>
                <div class="unit">KM/H</div>
            </div>
        </div>
    </div>

    <button id="start-btn" onclick="this.classList.add('hidden'); window.startRace()">START ENGINE</button>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
